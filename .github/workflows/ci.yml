name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Everything compiles
        run: python -m compileall -q .
      - name: Engine and MixItUp URLs
        run: python tests/test_server.py
      - name: Curtain GIFs (Govee faked)
        run: python tests/test_curtain.py
